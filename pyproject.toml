[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mkopo-mcp"
version = "0.1.0"
description = "MCP server for alternative credit scoring in Kenya — M-PESA transaction analysis, credit tier reports, loan eligibility"
authors = [{name = "Gabriel Mahia", email = "contact@aikungfu.dev"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
keywords = ["mcp", "credit", "kenya", "africa", "mpesa", "fintech", "microfinance", "mkopo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = ["fastmcp>=2.0.0"]

[project.urls]
Homepage = "https://github.com/gabrielmahia/mkopo-mcp"

[project.scripts]
mkopo-mcp = "mkopo_mcp.main:main"
