[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mkopo-mcp"
version = "0.1.9"
description = "MCP server for alternative credit scoring in Kenya — M-PESA-based behavioral signals"
authors = [{name = "Gabriel Mahia", email = "contact@aikungfu.dev"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["mcp", "credit", "kenya", "africa", "mpesa", "alternative-credit", "fintech", "mkopo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial",
]
dependencies = ["fastmcp>=2.0.0"]
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/gabrielmahia/mkopo-mcp"
Repository = "https://github.com/gabrielmahia/mkopo-mcp"
Issues = "https://github.com/gabrielmahia/mkopo-mcp/issues"
Documentation = "https://github.com/gabrielmahia/nairobi-stack"
"MCP Registry" = "https://registry.modelcontextprotocol.io"
Datasets = "https://huggingface.co/gmahia"
Evaluation = "https://github.com/gabrielmahia/kipimo"

[project.scripts]
mkopo-mcp = "mkopo_mcp.main:main"

[tool.setuptools.packages.find]
where = ["src"]
